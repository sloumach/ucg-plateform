name: Frontend quality

on:
  push:
  pull_request:

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: front/reports/vitest.xml
          if-no-files-found: ignore
          retention-days: 14

  end-to-end:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: back
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        working-directory: back
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            front/reports/playwright.xml
            front/reports/playwright-html
            front/reports/playwright-results
          if-no-files-found: ignore
          retention-days: 14
