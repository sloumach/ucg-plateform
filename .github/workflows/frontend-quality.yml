name: Frontend quality

on:
  push:
  pull_request:

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit locked frontend dependencies including development packages
        run: |
          mkdir -p reports
          npm audit --audit-level=low --json > reports/npm-audit.json

      - name: Run frontend lint
        run: npm run lint

      - name: Test release candidate integrity and CI admission
        run: node --test tests/real-api/release.test.mjs

      - name: Test fictional retention decisions without application access
        run: |
          npm run test:retention:harness
          node tests/real-api/retention-run.mjs > reports/retention-review.json

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: |
            front/reports/vitest.xml
            front/reports/npm-audit.json
            front/reports/retention-review.json
          if-no-files-found: ignore
          retention-days: 14

  retention-erasure:
    name: Tenant erasure and genuine PostgreSQL restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none

      - name: Install PostgreSQL 17 binaries for owned disposable clusters
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo apt-get install --yes postgresql-17
          echo 'UCG_BROWSER_PG_BIN=/usr/lib/postgresql/17/bin' >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: back
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify fixture boundaries and export snapshot paths
        run: node --test front/tests/real-api/postgresql.test.mjs front/tests/real-api/recovery-protocol.test.mjs

      - name: Require export erasure crash recovery and reconciliation of a real old backup
        run: node --test front/tests/real-api/retention-erasure.test.mjs

      - name: Upload synthetic erasure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-erasure-verification
          path: front/reports/retention-erasure-local.json
          if-no-files-found: error
          retention-days: 14

  end-to-end:
    name: Playwright end-to-end (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, posix, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none

      - name: Install PostgreSQL 17 binaries for the disposable browser cluster
        if: matrix.database == 'postgresql'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo apt-get install --yes postgresql-17
          echo 'UCG_BROWSER_PG_BIN=/usr/lib/postgresql/17/bin' >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: back
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        working-directory: back
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: matrix.database == 'sqlite'
        run: npm run test:e2e

      - name: Run isolated browser journey against real Laravel API
        if: matrix.database == 'sqlite'
        run: |
          npm run test:e2e:harness
          npm run test:load:harness
          npm run test:e2e:real

      - name: Run isolated PostgreSQL ownership and browser journeys
        if: matrix.database == 'postgresql'
        run: |
          npm run test:e2e:harness
          npm run test:e2e:postgresql:harness
          npm run test:e2e:postgresql

      - name: Test encrypted backup and isolated PostgreSQL recovery
        if: matrix.database == 'postgresql'
        run: |
          npm run test:recovery:harness
          npm run test:recovery
          npm run test:recovery:tenant
          npm run test:recovery:graph
          npm run test:recovery:qualification
          npm run test:recovery:pitr:harness
          npm run test:recovery:pitr

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-${{ matrix.database }}
          path: |
            front/reports/playwright.xml
            front/reports/playwright-html
            front/reports/playwright-results
            front/reports/playwright-real.xml
            front/reports/playwright-real-html
            front/reports/playwright-real-results
            front/reports/playwright-real-application.log
            front/reports/playwright-real-postgresql.xml
            front/reports/playwright-real-postgresql-html
            front/reports/playwright-real-postgresql-results
            front/reports/playwright-real-postgresql-application.log
            front/reports/recovery-local.json
            front/reports/tenant-recovery-local.json
            front/reports/tenant-graph-local.json
            front/reports/tenant-qualification-local.json
            front/reports/pitr-local.json
          if-no-files-found: ignore
          retention-days: 14
