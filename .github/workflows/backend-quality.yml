name: Backend quality

on:
  push:
  pull_request:

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pint, Larastan and PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, posix, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse -- --error-format=github

      - name: Run backend tests
        run: composer test:ci

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: back/reports/phpunit.xml
          if-no-files-found: ignore
          retention-days: 14
