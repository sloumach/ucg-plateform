name: Backend quality

on:
  push:
  pull_request:

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pint, Larastan and PHPUnit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ucg_platform_test
          POSTGRES_USER: ucg_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucg_test -d ucg_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, posix, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse -- --error-format=github

      - name: Run backend tests
        run: composer test:ci

      - name: Verify organization constraints on PostgreSQL
        run: php artisan test --compact tests/Feature/Modules/Tenancy tests/Feature/Architecture/Database tests/Feature/MfaAuthenticationTest.php tests/Feature/IdentityAuthenticationLifecycleTest.php tests/Feature/ContextualRolesTest.php tests/Feature/TenantDataVisibilityTest.php tests/Feature/PlatformRoleManagementTest.php tests/Feature/PlatformSupportAccessTest.php tests/Feature/AuditJournalTest.php tests/Feature/PersonControllerTest.php tests/Feature/PersonSchemaTest.php tests/Feature/PersonServiceTest.php tests/Feature/PersonPolicyTest.php tests/Feature/PersonListTest.php tests/Feature/GameProfileControllerTest.php tests/Feature/GameProfileSchemaTest.php tests/Feature/GameProfileServiceTest.php tests/Feature/PersonLifecycleControllerTest.php tests/Feature/PersonDepartureServiceTest.php tests/Feature/PersonLifecycleSchemaTest.php tests/Feature/PersonLifecyclePolicyTest.php tests/Feature/PersonCsvParserTest.php tests/Feature/PersonImportControllerTest.php tests/Feature/PersonImportProcessorTest.php tests/Feature/PersonImportPolicyTest.php tests/Feature/PersonImportSchemaTest.php tests/Feature/GameCatalogueControllerTest.php tests/Feature/GameCataloguePolicyTest.php tests/Feature/GameCatalogueSchemaTest.php tests/Feature/OrganizationGameControllerTest.php tests/Feature/TeamControllerTest.php tests/Feature/TeamServiceTest.php tests/Feature/TeamSchemaTest.php tests/Feature/TeamMembershipControllerTest.php tests/Feature/TeamMembershipServiceTest.php tests/Feature/TeamMembershipSchemaTest.php tests/Feature/TeamAuthorizationScopesTest.php tests/Feature/TeamLineupControllerTest.php tests/Feature/TeamLineupServiceTest.php tests/Feature/TeamLineupSchemaTest.php tests/Feature/TeamLineupPolicyTest.php tests/Feature/TeamEligibilityControllerTest.php tests/Feature/TeamEligibilityServiceTest.php tests/Feature/TeamEligibilitySchemaTest.php tests/Feature/TeamEligibilityPolicyTest.php tests/Feature/PersonBirthDateTest.php tests/Feature/ExternalOpponentControllerTest.php tests/Feature/ExternalOpponentServiceTest.php tests/Feature/ExternalOpponentSchemaTest.php tests/Feature/ContractControllerTest.php tests/Feature/ContractServiceTest.php tests/Feature/ContractSchemaTest.php tests/Feature/ContractDocumentControllerTest.php tests/Feature/ContractDocumentServiceTest.php tests/Feature/ContractDocumentSchemaTest.php tests/Feature/ContractDocumentScanTest.php tests/Feature/ContractDocumentScanSchemaTest.php tests/Feature/ContractDocumentSecurityControllerTest.php tests/Feature/PartnershipControllerTest.php tests/Feature/PartnershipPolicyTest.php tests/Feature/PartnershipSchemaTest.php tests/Feature/SponsorshipAgreementControllerTest.php tests/Feature/SponsorshipAgreementPolicyTest.php tests/Feature/SponsorshipAgreementSchemaTest.php tests/Feature/SponsorshipCampaignControllerTest.php tests/Feature/SponsorshipCampaignSchemaTest.php tests/Feature/MediaControllerTest.php tests/Feature/MediaSchemaTest.php tests/Feature/MediaPolicyTest.php tests/Feature/MediaLinkTest.php tests/Feature/CommunicationControllerTest.php tests/Feature/CommunicationSchemaTest.php tests/Feature/CommunicationAudienceTest.php tests/Feature/CommunicationPolicyTest.php tests/Feature/CalendarControllerTest.php tests/Feature/CalendarPolicyTest.php tests/Feature/CalendarSchemaTest.php tests/Feature/CalendarTimeTest.php tests/Feature/AvailabilityControllerTest.php tests/Feature/AvailabilityPolicyTest.php tests/Feature/AvailabilitySchemaTest.php tests/Feature/AvailabilityInputTest.php tests/Feature/CalendarConflictControllerTest.php tests/Feature/CalendarResourceControllerTest.php tests/Feature/CalendarConflictSchemaTest.php tests/Feature/CalendarConflictConcurrencyTest.php tests/Feature/CalendarInvitationControllerTest.php tests/Feature/CalendarInvitationWorkerTest.php tests/Feature/CalendarInvitationSchemaTest.php tests/Feature/CalendarInvitationPolicyTest.php tests/Feature/CalendarInvitationConcurrencyTest.php tests/Feature/CalendarFeedControllerTest.php tests/Feature/CalendarSubscriptionTest.php tests/Feature/CalendarFeedSchemaTest.php tests/Feature/CalendarFeedPolicyTest.php tests/Feature/CalendarChangeControllerTest.php tests/Feature/CalendarChangeWorkerTest.php tests/Feature/CalendarChangeSchemaTest.php tests/Feature/CalendarChangeConcurrencyTest.php tests/Feature/MatchControllerTest.php tests/Feature/MatchPolicyTest.php tests/Feature/MatchSchemaTest.php tests/Feature/MatchConcurrencyTest.php tests/Feature/MatchLineupControllerTest.php tests/Feature/MatchLineupSchemaTest.php tests/Feature/MatchScoreControllerTest.php tests/Feature/MatchScoreSchemaTest.php tests/Feature/MatchScoreConcurrencyTest.php tests/Feature/MatchResultControllerTest.php tests/Feature/MatchResultSchemaTest.php tests/Feature/MatchResultPolicyTest.php tests/Feature/MatchResultConcurrencyTest.php tests/Feature/MatchNotebookControllerTest.php tests/Feature/MatchNotebookSchemaTest.php tests/Feature/MatchNotebookPolicyTest.php tests/Feature/MatchNotebookConcurrencyTest.php tests/Feature/MatchCorrectionControllerTest.php tests/Feature/MatchCorrectionWorkerTest.php tests/Feature/MatchCorrectionSchemaTest.php tests/Feature/MatchCorrectionPolicyTest.php tests/Feature/MatchCorrectionConcurrencyTest.php tests/Feature/MatchRealtimeTest.php tests/Feature/ExternalCompetitionControllerTest.php tests/Feature/ExternalCompetitionDocumentTest.php tests/Feature/ExternalCompetitionPolicyTest.php tests/Feature/ExternalCompetitionSchemaTest.php tests/Feature/ExternalCompetitionConcurrencyTest.php tests/Feature/CompetitionRegistrationControllerTest.php tests/Feature/CompetitionRegistrationPolicyTest.php tests/Feature/CompetitionRegistrationSchemaTest.php tests/Feature/CompetitionRegistrationReminderTest.php tests/Feature/CompetitionRegistrationConcurrencyTest.php tests/Feature/CompetitionOutcomeTest.php tests/Feature/CompetitionOutcomeResultTest.php tests/Feature/CompetitionOutcomeConcurrencyTest.php tests/Feature/MetricCatalogueTest.php tests/Feature/MetricCatalogueConcurrencyTest.php tests/Feature/DashboardIndicatorTest.php tests/Feature/RoleDashboardTest.php tests/Feature/StatisticalProfileTest.php tests/Feature/StatisticalCalculationTest.php tests/Feature/StatisticalCalculationConcurrencyTest.php tests/Feature/StatisticalImportTest.php tests/Feature/StatisticalImportProcessingTest.php tests/Feature/StatisticalImportConcurrencyTest.php tests/Feature/ObservationTest.php tests/Feature/ObservationConcurrencyTest.php --log-junit=reports/phpunit-postgresql.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ucg_platform_test
          DB_USERNAME: ucg_test
          DB_PASSWORD: test-only-password
          DB_URL: ''

      - name: Verify tenant isolation on Redis
        run: php artisan test --compact tests/Feature/Modules/Tenancy/TenantRedisIsolationTest.php tests/Feature/Modules/Tenancy/TenantQueueRedisTest.php --log-junit=reports/phpunit-redis.xml
        env:
          TENANCY_TEST_REDIS: 'true'
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: 'null'
          REDIS_DB: 0
          REDIS_CACHE_DB: 1

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: back/reports/phpunit*.xml
          if-no-files-found: ignore
          retention-days: 14
