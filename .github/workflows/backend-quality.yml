name: Backend quality

on:
  push:
  pull_request:

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pint, Larastan and PHPUnit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ucg_platform_test
          POSTGRES_USER: ucg_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucg_test -d ucg_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pcntl, posix, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check PHP formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse -- --error-format=github

      - name: Run backend tests
        run: composer test:ci

      - name: Verify organization constraints on PostgreSQL
        run: php artisan test --compact tests/Feature/Modules/Tenancy tests/Feature/Architecture/Database --log-junit=reports/phpunit-postgresql.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ucg_platform_test
          DB_USERNAME: ucg_test
          DB_PASSWORD: test-only-password
          DB_URL: ''

      - name: Verify tenant isolation on Redis
        run: php artisan test --compact tests/Feature/Modules/Tenancy/TenantRedisIsolationTest.php --log-junit=reports/phpunit-redis.xml
        env:
          TENANCY_TEST_REDIS: 'true'
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: 'null'
          REDIS_DB: 0
          REDIS_CACHE_DB: 1

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: back/reports/phpunit*.xml
          if-no-files-found: ignore
          retention-days: 14
