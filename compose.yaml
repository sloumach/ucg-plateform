name: ucg-dev

# Development only. Source files stay on the host; Linux dependencies use volumes.
x-backend: &backend
  image: ucg-php-dev:8.5
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  init: true
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    FRONTEND_URL: http://localhost:5173
    DB_URL: ""
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ucg_platform
    DB_USERNAME: ucg
    DB_PASSWORD: ucg-local-development
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    TENANCY_CACHE_STORE: database
    TENANCY_SCHEDULE_CONNECTION: database
    SESSION_DRIVER: file
    SESSION_DOMAIN: "null"
    SESSION_SECURE_COOKIE: "false"
    SANCTUM_STATEFUL_DOMAINS: localhost:5173
    MAIL_MAILER: log
    FILESYSTEM_DISK: local
    ARTIFACTS_DISK: local
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ucg-local
    REVERB_APP_KEY: ucg-local-key
    REVERB_APP_SECRET: ucg-local-development-secret
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
    REVERB_ALLOWED_ORIGINS: localhost:5173
    REVERB_SCALING_ENABLED: "false"
    COMPOSER_CACHE_DIR: /tmp/composer-cache
  volumes:
    - ./back:/app
    - vendor:/app/vendor
    - composer-cache:/tmp/composer-cache
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *backend
    # Preserve Compose environment variables in Artisan's HTTP subprocess.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "database", "--queue=critical,default,notifications,broadcasts,reports", "--sleep=1", "--tries=3", "--timeout=300"]
    stop_grace_period: 310s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app:
        condition: service_healthy

  front:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_REVERB_APP_KEY: ucg-local-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: "8080"
      VITE_REVERB_SCHEME: http
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./front:/app
      # Frontend tests compare translated permissions with the server catalogue.
      - ./back/app:/back/app:ro
      - node-modules:/app/node_modules
      - npm-cache:/root/.npm

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ucg-local-postgres-admin
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-postgres-init.sql:/docker-entrypoint-initdb.d/01-ucg.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ucg -d ucg_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  vendor:
  node-modules:
  composer-cache:
  npm-cache:
